<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, Roboto, sans-serif;
    background: #121212; color: #fff;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 22px calc(28px + env(safe-area-inset-bottom)); text-align: center;
  }
  .hora { font-size: 56px; font-weight: 300; letter-spacing: 1px; }
  .fecha { font-size: 15px; color: #9b9b9b; margin-top: 2px; text-transform: capitalize; }
  .tarjeta {
    margin-top: 26px; width: 100%; max-width: 420px; aspect-ratio: 1 / 1; max-height: 46vh;
    background: #FBE3F2; border-radius: 30px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    animation: latido 1.3s ease-in-out infinite;
  }
  .tarjeta img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes latido {
    0%, 100% { transform: scale(1) rotate(0); }
    15% { transform: scale(1.02) rotate(-1.5deg); }
    30% { transform: scale(1.02) rotate(1.5deg); }
    45% { transform: scale(1) rotate(0); }
  }
  .chip {
    margin-top: 20px; display: inline-block; background: #F5A9DE; color: #161616;
    font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 99px;
  }
  h1 { font-size: 32px; line-height: 1.15; font-weight: 700; margin-top: 16px; }
  p  { font-size: 18px; line-height: 1.45; color: #cfcfcf; margin-top: 10px; max-width: 460px; white-space: pre-wrap; }
  button {
    margin-top: auto; width: 100%; max-width: 420px; padding: 19px; border: 0; border-radius: 99px;
    background: #fff; color: #161616; font-size: 19px; font-weight: 700; font-family: inherit;
  }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <div class="hora" id="hora">--:--</div>
  <div class="fecha" id="fecha"></div>

  <div class="tarjeta">
    <img id="imagen" src="imagen.png" alt="Imagen de la alerta"
         onerror="this.onerror=null; this.src='imagen.png'">
  </div>
  <span class="chip">Nueva alerta</span>
  <h1 id="titulo">¡Atención!</h1>
  <p id="mensaje"></p>

  <button id="apagar">Apagar</button>

<script>
  function reloj() {
    const d = new Date();
    document.getElementById('hora').textContent =
      d.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('fecha').textContent =
      d.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  reloj(); setInterval(reloj, 1000);

  try {
    const d = JSON.parse(Android.datos());
    document.getElementById('titulo').textContent = d.titulo;
    document.getElementById('mensaje').textContent = (d.mensaje || '').trim();
    if (d.imagen) document.getElementById('imagen').src = d.imagen;
  } catch (e) { /* vista previa fuera de la app */ }

  document.getElementById('apagar').addEventListener('click', () => {
    try { Android.apagar(); } catch (e) { alert('Apagado (vista previa)'); }
  });
</script>
</body>
</html>
