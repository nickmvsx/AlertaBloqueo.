name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Buscar proyecto
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "Proyecto en: $DIR"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: Compilar
        run: cd "$DIR" && gradle assembleRelease --no-daemon

      - name: Renombrar instalador
        run: cp "$DIR/app/build/outputs/apk/release/app-release.apk" AlertaBloqueo.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Alerta Bloqueo v1.${{ github.run_number }}
          body: Descarga **AlertaBloqueo.apk** desde el celular e instálalo.
          files: AlertaBloqueo.apk
          make_latest: true
