<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, Roboto, sans-serif;
    background: radial-gradient(circle at 50% 20%, #1F4E79 0%, #0b1a2b 70%);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 48px 24px 40px; text-align: center;
  }
  .hora { font-size: 64px; font-weight: 300; letter-spacing: 2px; }
  .fecha { font-size: 16px; opacity: .75; margin-top: 4px; text-transform: capitalize; }
  .centro { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  img {
    width: min(78vw, 320px); max-height: 42vh; object-fit: contain;
    border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
    animation: temblor 1.45s ease-in-out infinite;
  }
  @keyframes temblor {
    0%, 100% { transform: rotate(0); }
    10%, 30% { transform: rotate(-3deg); }
    20%, 40% { transform: rotate(3deg); }
    50%      { transform: rotate(0); }
  }
  h1 { font-size: 30px; font-weight: 700; }
  p  { font-size: 19px; line-height: 1.45; opacity: .92; max-width: 520px; white-space: pre-wrap; }
  button {
    width: 100%; max-width: 420px; padding: 20px; border: 0; border-radius: 999px;
    background: #C00000; color: #fff; font-size: 22px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(192,0,0,.4);
  }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <div>
    <div class="hora" id="hora">--:--</div>
    <div class="fecha" id="fecha"></div>
  </div>

  <div class="centro">
    <img id="imagen" src="imagen.png" alt="Imagen de la alerta"
         onerror="this.onerror=null; this.src='imagen.png'">
    <h1 id="titulo">¡Atención!</h1>
    <p id="mensaje">Este es tu mensaje de alerta.</p>
  </div>

  <button id="apagar">Apagar</button>

<script>
  function reloj() {
    const d = new Date();
    document.getElementById('hora').textContent =
      d.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('fecha').textContent =
      d.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  reloj(); setInterval(reloj, 1000);

  try {
    const d = JSON.parse(Android.datos());
    document.getElementById('titulo').textContent = d.titulo;
    document.getElementById('mensaje').textContent = d.mensaje.trim();
    if (d.imagen) document.getElementById('imagen').src = d.imagen;
  } catch (e) { /* vista previa fuera de la app */ }

  document.getElementById('apagar').addEventListener('click', () => {
    try { Android.apagar(); } catch (e) { alert('Apagado (vista previa)'); }
  });
</script>
</body>
</html>
